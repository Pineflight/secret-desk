name: Secret-Ablauf

# Taeglich: liest das Inventar (nur Metadaten) und legt je Stufe (30/14/7 Tage, abgelaufen, Datum fehlt) ein Issue an.
# Rot wird der Lauf bei abgelaufen oder in <= 7 Tagen faellig.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: secret-desk installieren
        run: npx --yes secret-desk@latest --help >/dev/null
      - name: Pruefen und Issues anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx --yes secret-desk@latest check --inventory inventory.yaml --json > findings.json || true
          node -e '
            const { execFileSync } = require("node:child_process");
            const findings = JSON.parse(require("node:fs").readFileSync("findings.json", "utf8"));
            for (const f of findings) {
              const title = "Secret-Ablauf: " + f.key;
              const open = execFileSync("gh", ["issue", "list", "--state", "open", "--search", title + " in:title", "--json", "title", "-q", ".[].title"], { encoding: "utf8" }).split("\n");
              if (!open.includes(title)) execFileSync("gh", ["issue", "create", "--title", title, "--body", f.text]);
            }
          '
          npx --yes secret-desk@latest check --inventory inventory.yaml
