name: Secret expiry

# Daily: reads the inventory (metadata only) and opens one issue per level (30/14/7 days, expired, date missing).
# The run turns red when a secret is expired or due within <= 7 days.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install secret-desk
        run: npx --yes secret-desk@latest --help >/dev/null
      - name: Check and open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx --yes secret-desk@latest check --inventory inventory.yaml --json > findings.json || true
          node -e '
            const { execFileSync } = require("node:child_process");
            const findings = JSON.parse(require("node:fs").readFileSync("findings.json", "utf8"));
            for (const f of findings) {
              const title = "Secret expiry: " + f.key;
              const open = execFileSync("gh", ["issue", "list", "--state", "open", "--search", title + " in:title", "--json", "title", "-q", ".[].title"], { encoding: "utf8" }).split("\n");
              if (!open.includes(title)) execFileSync("gh", ["issue", "create", "--title", title, "--body", f.text]);
            }
          '
          npx --yes secret-desk@latest check --inventory inventory.yaml
