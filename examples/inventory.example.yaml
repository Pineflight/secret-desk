# Inventory: metadata only, never values.
version: 1
thresholds: [30, 14, 7]

# Stages are freely configurable; behavior depends on `kind` (dev | test | live | shared).
# environment = name of the GitHub environment (if omitted: the id for test/live, none for dev/shared; null = explicitly none).
# If the section is missing: dev, staging, production, shared.
stages:
  - { id: dev, kind: dev, environment: null }
  - { id: staging, label: Staging, kind: test, environment: staging }
  - { id: production, label: Production, kind: live, environment: production }
  - { id: shared, kind: shared, environment: null }

secrets:
  - id: cloudflare-deploy-demo
    name: CLOUDFLARE_API_TOKEN
    description: Deploy access for the Workers of both repos
    owner: team-platform
    link: https://dash.cloudflare.com/profile/api-tokens
    tags: [deploy, cloudflare]
    product: demo
    stage: shared
    service: cloudflare
    provider: cloudflare-token
    params:
      accountId: "0123456789abcdef0123456789abcdef"
      permissions: ["Workers Scripts Write", "Account Settings Read"]
    ttlDays: 90
    expiry: possible
    places:
      - { repo: demo-app, scope: repository }
      - { repo: demo-website, scope: repository }

  - id: stripe-webhook-demo-staging
    name: STRIPE_WEBHOOK_SECRET
    product: demo
    stage: staging
    service: stripe
    provider: stripe-webhook-secret
    params: { url: "https://staging.example.com/api/stripe", events: ["checkout.session.completed"] }
    expiry: none
    places:
      - { repo: demo-app, scope: environment, environment: staging }

  - id: acme-key-demo-staging
    name: ACME_API_KEY
    stage: staging
    service: acme-api
    provider: acme-api            # custom provider without an API, see providers
    expiry: unknown
    places:
      - { repo: demo-app, scope: environment, environment: staging }

envTemplates:
  - id: demo-app-dev
    repo: demo-app
    stage: dev
    file: .env.local
    entries:
      - { key: NEXT_PUBLIC_SITE_URL, from: { type: default, value: "http://localhost:3000" } }
      - { key: RATE_LIMIT_SECRET, from: { type: generate, kind: hex, bytes: 32 } }
      - { key: STRIPE_SECRET_KEY, from: { type: prompt, hint: "Restricted key from the Stripe sandbox" } }

providers:
  - id: acme-api
    label: Acme API
    url: https://acme.example.com
    steps: ["Sign in to the Acme API dashboard", "Open API access", "Create a key and paste it into the portal"]
