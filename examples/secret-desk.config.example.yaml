# Copy to secret-desk.config.yaml (listed in .gitignore). Contains no values, only sources.
inventory: ./inventory.yaml

# Local file with the folder links of the repositories (machine-specific, never in the inventory).
# Default: ~/.secret-desk/repo-links.json (mode 600). Only set it if it should live elsewhere.
# linksFile: ~/.secret-desk/repo-links.json

# Vault for the integrations' access tokens (encrypted). The key lives in the system keyring:
# macOS Keychain, Linux secret-tool, Windows DPAPI (blob next to the vault file). Or SECRET_DESK_VAULT_KEY (32 bytes, Base64).
# vault:
#   enabled: true
#   file: ~/.secret-desk/vault.json
#   # Set only explicitly. Windows: location of the DPAPI blob. Linux/macOS: key file (Base64, mode 600) instead of the keyring;
#   # key and data then sit on the same disk. Only for systems without a keyring.
#   # keyFile: ~/.secret-desk/vault.key

github:
  owner: Pineflight
  # Option A: enter the token in the portal for this session only (default)
  auth:
    type: pat
    source: { type: session }
  # Option B: GitHub App, a token valid for one hour is created per run
  # auth:
  #   type: app
  #   appId: "123456"
  #   privateKey: { type: op, ref: "op://Privat/secret-desk GitHub App/private key" }

# Where the providers' access tokens come from. Never the value itself.
connections:
  cloudflare: { type: session }               # token with "API Tokens Write", for this session only
  supabase: { type: env, name: SUPABASE_ACCESS_TOKEN }
  resend: { type: op, ref: "op://Privat/Resend/api key" }

policy:
  # Stage ids that agents may touch without approval (never live). If omitted: all stages of kind dev.
  # Everything else needs an approval in the portal.
  agentStages: [dev]
  # Folders where agents may write .env files. "Search locally" also looks for Git folders here
  # (up to depth 2), and links may live here (in addition to the home folder).
  # Windows: 'C:\Users\me\Projects' (single quotes) or C:/Users/me/Projects
  envRoots:
    - /Users/ich/Projekte

# Browser automation for providers without an API (docs/BROWSER-AUTOMATION.md). All optional.
# secret-desk opens a visible Chrome; sign-in, 2FA and CAPTCHA are always done by the human in the window.
automation:
  enabled: true                       # false = no browser providers
  # chromePath: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
  # profileDir: ~/.secret-desk/browser-profile
  loginTimeoutMinutes: 10             # wait time for sign-in, 2FA, CAPTCHA
  # slowMoMs: 150                     # slow down browser actions so you can watch
  # recipesDirs: [~/secret-desk-recipes]   # additional recipe folders; <inventory folder>/recipes is always read

server:
  port: 4747
