# Nach secret-desk.config.yaml kopieren (steht in .gitignore). Enthaelt keine Werte, nur Quellen.
inventory: ./inventory.yaml

# Lokale Datei mit den Ordner-Verknuepfungen der Repositories (rechnerspezifisch, nie im Inventar).
# Standard: ~/.secret-desk/repo-links.json (Modus 600). Nur setzen, wenn sie woanders liegen soll.
# linksFile: ~/.secret-desk/repo-links.json

# Tresor fuer Zugangs-Tokens der Integrationen (verschluesselt). Der Schluessel liegt im Schluesselbund des Systems:
# macOS Keychain, Linux secret-tool, Windows DPAPI (Blob neben der Tresordatei). Oder SECRET_DESK_VAULT_KEY (32 Byte, Base64).
# vault:
#   enabled: true
#   file: ~/.secret-desk/vault.json
#   # Nur ausdruecklich setzen. Windows: Ort des DPAPI-Blobs. Linux/macOS: Schluesseldatei (Base64, Modus 600) statt Schluesselbund;
#   # Schluessel und Daten liegen dann auf demselben Datentraeger. Nur fuer Systeme ohne Schluesselbund.
#   # keyFile: ~/.secret-desk/vault.key

github:
  owner: Pineflight
  # Variante A: Token nur fuer diese Sitzung im Portal eingeben (Standard)
  auth:
    type: pat
    source: { type: session }
  # Variante B: GitHub App, pro Lauf entsteht ein Token fuer eine Stunde
  # auth:
  #   type: app
  #   appId: "123456"
  #   privateKey: { type: op, ref: "op://Privat/secret-desk GitHub App/private key" }

# Woher die Zugangs-Tokens der Anbieter kommen. Nie der Wert selbst.
connections:
  cloudflare: { type: session }               # Token mit "API Tokens Write", nur fuer diese Sitzung
  supabase: { type: env, name: SUPABASE_ACCESS_TOKEN }
  resend: { type: op, ref: "op://Privat/Resend/api key" }

policy:
  # Stages, die Agenten ohne Freigabe anfassen duerfen. Alles andere braucht eine Freigabe im Portal.
  agentStages: [dev]
  # Ordner, in die Agenten .env-Dateien schreiben duerfen. Hier sucht "Lokal suchen" auch nach Git-Ordnern
  # (bis Tiefe 2) und hier duerfen Verknuepfungen liegen (zusaetzlich zum Home-Ordner).
  # Windows: 'C:\Users\ich\Projekte' (einfache Anfuehrungszeichen) oder C:/Users/ich/Projekte
  envRoots:
    - /Users/ich/Projekte

# Browser-Automatisierung fuer Anbieter ohne API (docs/BROWSER-AUTOMATION.md). Alles optional.
# secret-desk oeffnet ein sichtbares Chrome; Anmeldung, 2FA und CAPTCHA macht immer der Mensch im Fenster.
automation:
  enabled: true                       # false = keine Browser-Anbieter
  # chromePath: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
  # profileDir: ~/.secret-desk/browser-profile
  loginTimeoutMinutes: 10             # Wartezeit auf Anmeldung, 2FA, CAPTCHA
  # slowMoMs: 150                     # Browseraktionen verlangsamen, zum Zuschauen
  # recipesDirs: [~/secret-desk-recipes]   # weitere Rezeptordner; <Inventarordner>/recipes wird immer gelesen

server:
  port: 4747
