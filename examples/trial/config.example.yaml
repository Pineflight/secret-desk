# Trial run against the throwaway repo Pineflight/secret-desk-sandbox. Contains no values, only sources.
inventory: ./inventory.yaml
evidenceDir: ./evidence

github:
  owner: Pineflight
  auth:
    type: pat
    # Fine-grained token ONLY for the sandbox repo. Before starting: export SECRET_DESK_GITHUB_TOKEN=...
    # (or enter it in the portal under Integrations for the session and set { type: session } here)
    source: { type: env, name: SECRET_DESK_GITHUB_TOKEN }

connections:
  # Token with "API Tokens: Edit" (short-lived, 1 day). Before starting: export SECRET_DESK_CLOUDFLARE_TOKEN=...
  cloudflare: { type: env, name: SECRET_DESK_CLOUDFLARE_TOKEN }

policy:
  agentStages: [dev]
  envRoots:
    - ~/secret-desk-trial

server: { port: 4747 }
