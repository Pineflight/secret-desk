# Trial-run inventory. Everything points at the throwaway repo. Metadata only.
version: 1
thresholds: [30, 14, 7]

secrets:
  # A: GitHub only, no provider. Tests generate, review report, confirm, write.
  - id: trial-random
    name: SD_TRIAL_RANDOM
    description: Random value for the trial run, without a provider. Tests the flow up to GitHub.
    owner: niklas
    tags: [probelauf]
    stage: staging
    service: intern
    provider: random-hex
    params: { bytes: 32 }
    expiry: none
    places:
      - { repo: secret-desk-sandbox, scope: environment, environment: staging }

  # B: real provider. On renewal, creates a Cloudflare token with a single harmless read permission, valid for 7 days.
  # Replace DEINE_CLOUDFLARE_ACCOUNT_ID (Cloudflare dashboard, account, "Copy account ID").
  - id: trial-cloudflare
    name: SD_TRIAL_CLOUDFLARE
    description: Throwaway Cloudflare token with only "Account Settings Read", valid for 7 days.
    owner: niklas
    link: https://dash.cloudflare.com/profile/api-tokens
    tags: [probelauf, cloudflare]
    stage: staging
    service: cloudflare
    provider: cloudflare-token
    params:
      accountId: DEINE_CLOUDFLARE_ACCOUNT_ID
      permissions: ["Account Settings Read"]
    ttlDays: 7
    expiry: possible
    places:
      - { repo: secret-desk-sandbox, scope: environment, environment: staging }

  # C: by hand. You create a throwaway token (GitHub fine-grained, no permissions) and paste it into the portal.
  - id: trial-manual
    name: SD_TRIAL_MANUAL
    description: Throwaway token pasted in by hand, to test the verification of manual values.
    owner: niklas
    tags: [probelauf]
    stage: staging
    service: github
    provider: github-fine-grained-token
    params:
      permissions: { metadata: read }
    ttlDays: 1
    expiry: possible
    places:
      - { repo: secret-desk-sandbox, scope: repository }

variables:
  - id: trial-site-url
    name: SD_TRIAL_URL
    description: Base URL for the trial run, as a variable (not a secret).
    owner: niklas
    tags: [probelauf, url]
    stage: staging
    value: "https://example.com/probelauf"
    places:
      - { repo: secret-desk-sandbox, scope: environment, environment: staging }
  - id: trial-flag
    name: SD_TRIAL_FLAG
    description: "Target value not known yet. Test importing it from GitHub in the portal (set it once by hand in GitHub beforehand)."
    tags: [probelauf]
    stage: shared
    places:
      - { repo: secret-desk-sandbox, scope: repository }

envTemplates:
  - id: trial-dev
    repo: secret-desk-sandbox
    stage: dev
    file: .env.local
    entries:
      - { key: SD_TRIAL_URL, from: { type: variable, variable: trial-site-url } }
      - { key: SD_TRIAL_RANDOM, from: { type: generate, kind: hex, bytes: 16 } }
      - { key: SD_TRIAL_SANDBOX_KEY, from: { type: prompt, hint: "any test value" } }

providers: []
