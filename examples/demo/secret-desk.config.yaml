# Demo: simulated GitHub, no real accounts. Start: SECRET_DESK_DEMO=1 SECRET_DESK_CONFIG=examples/demo/secret-desk.config.yaml pnpm dev
inventory: ./inventory.yaml
evidenceDir: ./.evidence
github:
  owner: acme
  auth: { type: pat, source: { type: env, name: GITHUB_DEMO_TOKEN } }
policy:
  agentStages: [dev]
  envRoots: ["/tmp/secret-desk-demo"]
server: { port: 4747 }
