# Demo with team sync set up: simulated GitHub, repository acme/team-config, read and push through a pull request.
# Start: pnpm demo --team   (copies this folder to a temporary one; nothing in the repository changes)
inventory: ./inventory.yaml
evidenceDir: ./.evidence
github:
  owner: acme
  auth: { type: pat, source: { type: env, name: GITHUB_DEMO_TOKEN } }
teamSync:
  repo: acme/team-config
  branch: main
  path: secret-desk.team.yaml
  mode: pull-push
  push: { strategy: pull-request, branch: secret-desk/team-sync }
  pullOnStart: true
policy:
  agentStages: [dev]
  envRoots: ["/tmp/secret-desk-demo"]
server: { port: 4747 }
