# Demo inventory with made-up values and targets. Metadata only.
version: 1
thresholds: [ 30, 14, 7 ]

secrets:
  - id: cloudflare-deploy-acme-app
    name: CLOUDFLARE_API_TOKEN
    product: acme-app
    description: "Deploy access for the Workers and Pages of Acme App: read by the deploy workflows of the app and the landing page."
    owner: alice
    link: https://dash.cloudflare.com/profile/api-tokens
    tags: [deploy, cloudflare, acme-app]
    stage: shared
    service: cloudflare
    provider: random-hex
    expiry: possible
    expires: "2026-11-02"
    ttlDays: 90
    places:
      - { repo: acme-app, scope: repository }
  - id: vapid-private-acme-app
    name: VAPID_PRIVATE_KEY
    product: acme-app
    description: Private key for web push notifications. Pairs with the public key in the variables.
    owner: alice
    tags: [push, acme-app]
    stage: shared
    service: web-push
    provider: random-hex
    expiry: none
    places:
      - { repo: acme-app, scope: repository }
  - id: hmac-acme-app-staging
    name: ARTIFACT_HMAC_SECRET
    product: acme-app
    description: Signs artifact links in the book worker. Must be identical in the worker and in the edge function.
    owner: alice
    tags: [signature, acme-app]
    stage: staging
    service: intern
    provider: random-hex
    expiry: none
    places:
      - { repo: acme-app, scope: environment, environment: staging }
    rotatedAt: 2026-10-27
    verifiedAt: 2026-10-27
    verifiedBy: alice
    expires: null
  - id: vesselapi-acme-app-staging
    name: VESSELAPI_API_KEY
    product: acme-app
    description: Access to the VesselAPI for port events and vessel data (staging plan).
    owner: alice
    link: https://vesselapi.com
    tags: [ais, acme-app]
    stage: staging
    service: vesselapi
    provider: vesselapi
    expiry: unknown
    places:
      - { repo: acme-app, scope: environment, environment: staging }
  - id: stripe-webhook-acme-web-staging
    name: STRIPE_WEBHOOK_SECRET
    product: acme-web
    description: Signature check for Stripe webhooks in the sandbox, so payments are booked in the portal.
    owner: alice
    link: https://dashboard.stripe.com/test/webhooks
    tags: [payment, acme-web]
    stage: staging
    service: stripe
    provider: stripe-restricted-key
    expiry: none
    expires: null
    places:
      - { repo: acme-web, scope: environment, environment: staging }
  - id: openai-acme-docs-staging
    name: OPENAI_API_KEY
    product: acme-docs
    description: Project key for the assistant in staging, with a spending limit.
    owner: alice
    link: https://platform.openai.com/api-keys
    tags: [ai, acme-docs]
    stage: staging
    service: openai
    provider: openai
    expiry: none
    places:
      - { repo: acme-docs, scope: environment, environment: staging }
  - id: supabase-access-acme-docs
    name: SUPABASE_ACCESS_TOKEN
    product: acme-docs
    description: Access token for migrations and deploys of the Supabase projects of Acme Docs (CI).
    owner: alice
    link: https://supabase.com/dashboard/account/tokens
    tags: [ci, supabase, acme-docs]
    stage: shared
    service: supabase
    provider: supabase-access-token
    expiry: required
    places:
      - { repo: acme-docs, scope: repository }
  - id: lead-token-dev
    name: LEAD_INTAKE_TOKEN
    product: acme-web
    description: Local token for the lead intake during development; every developer gets their own.
    owner: alice
    tags: [dev, acme-web]
    stage: dev
    service: intern
    provider: random-hex
    expiry: none

variables:
  - id: revenuecat-project-acme-app
    name: REVENUECAT_PROJECT_ID
    product: acme-app
    description: "Identifier of the RevenueCat project the product setup works from."
    owner: alice
    link: https://app.revenuecat.com
    tags: [revenuecat, acme-app]
    stage: shared
    value: proj_demo_123
    places:
      - { repo: acme-app, scope: repository }
  - id: site-url-acme-web-staging
    name: NEXT_PUBLIC_SITE_URL
    product: acme-web
    description: "Base URL of the Acme Web staging site, for links in emails and webhooks."
    owner: alice
    tags: [url, acme-web]
    stage: staging
    value: "https://app-staging.example.com"
    places:
      - { repo: acme-web, scope: environment, environment: staging }
  - id: site-url-acme-docs-staging
    name: NEXT_PUBLIC_SITE_URL
    product: acme-docs
    description: "Base URL of the Acme Docs staging site."
    owner: alice
    tags: [url, acme-docs]
    stage: staging
    value: "https://docs-staging.example.com"
    places:
      - { repo: acme-docs, scope: environment, environment: staging }
  - id: print-env-acme-app
    name: PRINT_ENV
    product: acme-app
    description: "Print mode: sandbox tests without a real order, live triggers real print jobs."
    owner: alice
    tags: [print, acme-app]
    stage: staging
    places:
      - { repo: acme-app, scope: environment, environment: staging }

envTemplates:
  - id: acme-web-dev
    repo: acme-web
    stage: dev
    entries:
      - {
          key: NEXT_PUBLIC_SITE_URL,
          from: { type: default, value: "http://localhost:3000" }
        }
      - { key: LEAD_INTAKE_TOKEN, from: { type: generate, kind: hex, bytes: 32 } }
      - {
          key: STRIPE_SECRET_KEY,
          from: { type: prompt, hint: "Restricted key from the Stripe sandbox" }
        }
  - id: acme-docs-dev
    repo: acme-docs
    stage: dev
    entries:
      - {
          key: NEXT_PUBLIC_SITE_URL,
          from: { type: variable, variable: site-url-acme-docs-staging }
        }
      - { key: RATE_LIMIT_SECRET, from: { type: generate, kind: hex, bytes: 16 } }

providers: []
