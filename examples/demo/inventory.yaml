# Demo inventory with made-up values and targets. Metadata only.
version: 1
thresholds: [ 30, 14, 7 ]

secrets:
  - id: cloudflare-deploy-wakemiles
    name: CLOUDFLARE_API_TOKEN
    product: wakemiles
    description: "Deploy access for the Workers and Pages of WakeMiles: read by the deploy workflows of the app and the landing page."
    owner: niklas
    link: https://dash.cloudflare.com/profile/api-tokens
    tags: [deploy, cloudflare, wakemiles]
    stage: shared
    service: cloudflare
    provider: random-hex
    expiry: possible
    expires: "2026-11-02"
    ttlDays: 90
    places:
      - { repo: wake-miles, scope: repository }
  - id: vapid-private-wakemiles
    name: VAPID_PRIVATE_KEY
    product: wakemiles
    description: Private key for web push notifications. Pairs with the public key in the variables.
    owner: niklas
    tags: [push, wakemiles]
    stage: shared
    service: web-push
    provider: random-hex
    expiry: none
    places:
      - { repo: wake-miles, scope: repository }
  - id: hmac-wakemiles-staging
    name: ARTIFACT_HMAC_SECRET
    product: wakemiles
    description: Signs artifact links in the book worker. Must be identical in the worker and in the edge function.
    owner: niklas
    tags: [signatur, wakemiles]
    stage: staging
    service: intern
    provider: random-hex
    expiry: none
    places:
      - { repo: wake-miles, scope: environment, environment: staging }
    rotatedAt: 2026-10-27
    verifiedAt: 2026-10-27
    verifiedBy: niklas
    expires: null
  - id: vesselapi-wakemiles-staging
    name: VESSELAPI_API_KEY
    product: wakemiles
    description: Access to the VesselAPI for port events and vessel data (staging plan).
    owner: niklas
    link: https://vesselapi.com
    tags: [ais, wakemiles]
    stage: staging
    service: vesselapi
    provider: vesselapi
    expiry: unknown
    places:
      - { repo: wake-miles, scope: environment, environment: staging }
  - id: stripe-webhook-webstudio-staging
    name: STRIPE_WEBHOOK_SECRET
    product: web-studio
    description: Signature check for Stripe webhooks in the sandbox, so payments are booked in the portal.
    owner: niklas
    link: https://dashboard.stripe.com/test/webhooks
    tags: [zahlung, web-studio]
    stage: staging
    service: stripe
    provider: stripe-restricted-key
    expiry: none
    expires: null
    places:
      - { repo: web-studio, scope: environment, environment: staging }
  - id: openai-leitfaden-staging
    name: OPENAI_API_KEY
    product: leitfaden
    description: Project key for the assistant in staging, with a spending limit.
    owner: niklas
    link: https://platform.openai.com/api-keys
    tags: [ki, leitfaden]
    stage: staging
    service: openai
    provider: openai
    expiry: none
    places:
      - { repo: leitfaden, scope: environment, environment: staging }
  - id: supabase-access-leitfaden
    name: SUPABASE_ACCESS_TOKEN
    product: leitfaden
    description: Access token for migrations and deploys of the Supabase projects of Leitfaden (CI).
    owner: niklas
    link: https://supabase.com/dashboard/account/tokens
    tags: [ci, supabase, leitfaden]
    stage: shared
    service: supabase
    provider: supabase-access-token
    expiry: required
    places:
      - { repo: leitfaden, scope: repository }
  - id: lead-token-dev
    name: LEAD_INTAKE_TOKEN
    product: web-studio
    description: Local token for the lead intake during development; every developer gets their own.
    owner: niklas
    tags: [dev, web-studio]
    stage: dev
    service: intern
    provider: random-hex
    expiry: none

variables:
  - id: revenuecat-project-wakemiles
    name: REVENUECAT_PROJECT_ID
    product: wakemiles
    description: "Identifier of the RevenueCat project the product setup works from."
    owner: niklas
    link: https://app.revenuecat.com
    tags: [revenuecat, wakemiles]
    stage: shared
    value: proj_demo_123
    places:
      - { repo: wake-miles, scope: repository }
  - id: site-url-webstudio-staging
    name: NEXT_PUBLIC_SITE_URL
    product: web-studio
    description: "Base URL of the Web Studio staging site, for links in emails and webhooks."
    owner: niklas
    tags: [url, web-studio]
    stage: staging
    value: "https://web-studio-app-staging.pineflight.com"
    places:
      - { repo: web-studio, scope: environment, environment: staging }
  - id: site-url-leitfaden-staging
    name: NEXT_PUBLIC_SITE_URL
    product: leitfaden
    description: "Base URL of the Leitfaden staging site."
    owner: niklas
    tags: [url, leitfaden]
    stage: staging
    value: "https://leitfaden-staging.pineflight.com"
    places:
      - { repo: leitfaden, scope: environment, environment: staging }
  - id: print-env-wakemiles
    name: PRINT_ENV
    product: wakemiles
    description: "Print mode: sandbox tests without a real order, live triggers real print jobs."
    owner: niklas
    tags: [druck, wakemiles]
    stage: staging
    places:
      - { repo: wake-miles, scope: environment, environment: staging }

envTemplates:
  - id: web-studio-dev
    repo: web-studio
    stage: dev
    entries:
      - {
          key: NEXT_PUBLIC_SITE_URL,
          from: { type: default, value: "http://localhost:3000" }
        }
      - { key: LEAD_INTAKE_TOKEN, from: { type: generate, kind: hex, bytes: 32 } }
      - {
          key: STRIPE_SECRET_KEY,
          from: { type: prompt, hint: "Restricted key from the Stripe sandbox" }
        }
  - id: leitfaden-dev
    repo: leitfaden
    stage: dev
    entries:
      - {
          key: NEXT_PUBLIC_SITE_URL,
          from: { type: variable, variable: site-url-leitfaden-staging }
        }
      - { key: RATE_LIMIT_GEHEIMNIS, from: { type: generate, kind: hex, bytes: 16 } }

providers: []
