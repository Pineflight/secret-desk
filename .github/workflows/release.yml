name: Release

# Bei jedem Lauf auf main: pruefen, je Plattform nativ zwei Images bauen (amd64 und arm64: das Portal und der
# Browser-Sidecar docker/browser), daraus je ein Multi-Arch-Manifest nach ghcr.io legen und ein GitHub-Release anlegen.
# Tag und Image-Version: <package.json>-<Laufnummer> (beide Images gleich).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  version:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version bestimmen
        id: version
        run: |
          base=$(node -p "require('./package.json').version")
          echo "tag=v${base}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=secret-desk
            org.opencontainers.image.description=secret-desk: portal, CLI and MCP server for secret inventory and rotation
            org.opencontainers.image.vendor=Pineflight
            org.opencontainers.image.authors=Pineflight
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            SECRET_DESK_BUILD_TAG=${{ needs.version.outputs.tag }}
            SECRET_DESK_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta_browser
        with:
          images: ghcr.io/${{ github.repository }}-browser
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=secret-desk-browser
            org.opencontainers.image.description=secret-desk-browser: headed Chromium with noVNC and a DevTools endpoint for secret-desk browser automation
            org.opencontainers.image.vendor=Pineflight
            org.opencontainers.image.authors=Pineflight
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/DOCKER.md#browser-on-the-pi
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/browser
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta_browser.outputs.tags }}
          labels: ${{ steps.meta_browser.outputs.labels }}
          cache-from: type=gha,scope=browser-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=browser-${{ matrix.arch }}

  manifest:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      # Annotationen am Index (docker buildx imagetools create unterstuetzt dort den Praefix "index:").
      DOCKER_METADATA_ANNOTATIONS_LEVELS: index
    steps:
      # Image-Referenzen muessen kleingeschrieben sein, der Repository-Name (Pineflight/...) nicht.
      - name: Image-Name in Kleinbuchstaben
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.title=secret-desk
            org.opencontainers.image.description=secret-desk: portal, CLI and MCP server for secret inventory and rotation
            org.opencontainers.image.vendor=Pineflight
            org.opencontainers.image.authors=Pineflight
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta_browser
        with:
          images: ghcr.io/${{ github.repository }}-browser
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.title=secret-desk-browser
            org.opencontainers.image.description=secret-desk-browser: headed Chromium with noVNC and a DevTools endpoint for secret-desk browser automation
            org.opencontainers.image.vendor=Pineflight
            org.opencontainers.image.authors=Pineflight
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/DOCKER.md#browser-on-the-pi
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
      # Zwei metadata-action-Schritte: DOCKER_METADATA_OUTPUT_JSON gehoert dem letzten, deshalb je Schritt die eigene Ausgabe.
      - name: Multi-Arch-Manifest anlegen
        env:
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done < <(jq -r '.tags[]' <<<"$METADATA")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done < <(jq -r '(.annotations // [])[]' <<<"$METADATA")
          docker buildx imagetools create "${args[@]}" "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
      - name: Multi-Arch-Manifest des Browser-Sidecars anlegen
        env:
          METADATA: ${{ steps.meta_browser.outputs.json }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done < <(jq -r '.tags[]' <<<"$METADATA")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done < <(jq -r '(.annotations // [])[]' <<<"$METADATA")
          docker buildx imagetools create "${args[@]}" "${IMAGE}-browser:${TAG}-amd64" "${IMAGE}-browser:${TAG}-arm64"
      - name: Plattformen im Manifest pruefen
        run: |
          for ref in "${IMAGE}:${TAG}" "${IMAGE}:latest" "${IMAGE}-browser:${TAG}" "${IMAGE}-browser:latest"; do
            manifest=$(docker buildx imagetools inspect "$ref")
            echo "$manifest"
            for platform in linux/amd64 linux/arm64; do
              echo "$manifest" | grep -q "Platform: *${platform}$" || { echo "Plattform fehlt in ${ref}: ${platform}" >&2; exit 1; }
            done
          done
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes \
            --notes "License: MIT. Docker (linux/amd64, linux/arm64): \`docker pull ${IMAGE}:${TAG}\` and the browser sidecar \`docker pull ${IMAGE}-browser:${TAG}\`"
