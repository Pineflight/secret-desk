# On every run on main: verify, build the portal image natively per platform (amd64 and arm64), put a multi-arch manifest
# on ghcr.io and create a GitHub release. Tag and image version: <package.json version>-<run number>.
#
# The browser sidecar (docker/browser) is built and published only when docker/browser changed since the previous release
# tag (or no sidecar image exists yet). Reason: Watchtower restarts every container whose :latest changes. If the sidecar were
# republished on every merge, each merge would cut off a sign-in a human is typing in the browser window. Even unchanged
# content with new annotations is a new digest, so the sidecar's :latest stays completely untouched while its content is the
# same. The sidecar tag <version>-<run number> names the release in which the sidecar last changed.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run verify
        run: pnpm run verify
      - name: Check third-party licences
        run: node scripts/licenses.mjs --check
      - name: Scan for committed values
        run: bash scripts/scan-values.sh

  version:
    name: Version
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      browser_changed: ${{ steps.browser.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release tags and the history are needed to compare with the previous release.
          fetch-depth: 0
      - name: Log in to registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine version
        id: version
        run: |
          base=$(node -p "require('./package.json').version")
          echo "tag=v${base}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Browser sidecar changed?
        id: browser
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-browser"
          # Previous release: the newest v* tag reachable from the parent commit. A failed release does not move it, so the
          # comparison then covers several commits (conservative).
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          reason=""
          if [ -z "$prev" ]; then
            reason="there is no previous release tag yet"
          elif ! git diff --quiet "$prev" HEAD -- docker/browser; then
            reason="docker/browser changed since ${prev}"
          elif ! docker buildx imagetools inspect "${image}:latest" > /dev/null 2>&1; then
            reason="${image}:latest does not exist yet"
          fi
          if [ -n "$reason" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Building the browser sidecar: ${reason}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Browser sidecar unchanged (docker/browser is the same as at ${prev}): no build, :latest stays"
          fi

  build:
    name: Build Image (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=secret-desk
            org.opencontainers.image.description=secret-desk: portal, CLI and MCP server for secret inventory and rotation
            org.opencontainers.image.vendor=Pineflight
            org.opencontainers.image.authors=Pineflight
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            SECRET_DESK_BUILD_TAG=${{ needs.version.outputs.tag }}
            SECRET_DESK_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Extract browser sidecar metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        if: needs.version.outputs.browser_changed == 'true'
        id: meta_browser
        with:
          images: ghcr.io/${{ github.repository }}-browser
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=secret-desk-browser
            org.opencontainers.image.description=secret-desk-browser: headed Chromium with noVNC and a DevTools endpoint for secret-desk browser automation
            org.opencontainers.image.vendor=Pineflight
            org.opencontainers.image.authors=Pineflight
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/DOCKER.md#browser-on-the-pi
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push browser sidecar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: needs.version.outputs.browser_changed == 'true'
        with:
          context: docker/browser
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta_browser.outputs.tags }}
          labels: ${{ steps.meta_browser.outputs.labels }}
          cache-from: type=gha,scope=browser-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=browser-${{ matrix.arch }}

  manifest:
    name: Publish Manifest and Release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      BROWSER_CHANGED: ${{ needs.version.outputs.browser_changed }}
      # Annotations on the index (docker buildx imagetools create supports the "index:" prefix there).
      DOCKER_METADATA_ANNOTATIONS_LEVELS: index
    steps:
      # Image references must be lowercase, the repository name (with its owner) is not.
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.title=secret-desk
            org.opencontainers.image.description=secret-desk: portal, CLI and MCP server for secret inventory and rotation
            org.opencontainers.image.vendor=Pineflight
            org.opencontainers.image.authors=Pineflight
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Extract browser sidecar metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        if: needs.version.outputs.browser_changed == 'true'
        id: meta_browser
        with:
          images: ghcr.io/${{ github.repository }}-browser
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.title=secret-desk-browser
            org.opencontainers.image.description=secret-desk-browser: headed Chromium with noVNC and a DevTools endpoint for secret-desk browser automation
            org.opencontainers.image.vendor=Pineflight
            org.opencontainers.image.authors=Pineflight
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/DOCKER.md#browser-on-the-pi
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
      # Two metadata-action steps: DOCKER_METADATA_OUTPUT_JSON belongs to the last one, so each step uses its own output.
      - name: Create multi-arch manifest
        env:
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done < <(jq -r '.tags[]' <<<"$METADATA")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done < <(jq -r '(.annotations // [])[]' <<<"$METADATA")
          docker buildx imagetools create "${args[@]}" "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
      - name: Create multi-arch manifest of the browser sidecar
        if: needs.version.outputs.browser_changed == 'true'
        env:
          METADATA: ${{ steps.meta_browser.outputs.json }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done < <(jq -r '.tags[]' <<<"$METADATA")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done < <(jq -r '(.annotations // [])[]' <<<"$METADATA")
          docker buildx imagetools create "${args[@]}" "${IMAGE}-browser:${TAG}-amd64" "${IMAGE}-browser:${TAG}-arm64"
      - name: Verify platforms in manifest
        run: |
          refs=("${IMAGE}:${TAG}" "${IMAGE}:latest")
          if [ "$BROWSER_CHANGED" = "true" ]; then refs+=("${IMAGE}-browser:${TAG}" "${IMAGE}-browser:latest"); fi
          for ref in "${refs[@]}"; do
            manifest=$(docker buildx imagetools inspect "$ref")
            echo "$manifest"
            for platform in linux/amd64 linux/arm64; do
              echo "$manifest" | grep -q "Platform: *${platform}$" || { echo "Platform missing in ${ref}: ${platform}" >&2; exit 1; }
            done
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="License: MIT. Docker (linux/amd64, linux/arm64): \`docker pull ${IMAGE}:${TAG}\`."
          if [ "$BROWSER_CHANGED" = "true" ]; then
            notes="${notes} The browser sidecar changed in this release: \`docker pull ${IMAGE}-browser:${TAG}\`."
          else
            notes="${notes} The browser sidecar is unchanged (\`docker pull ${IMAGE}-browser:latest\`)."
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --notes "$notes"
