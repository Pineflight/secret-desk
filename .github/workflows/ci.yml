# Proves a change: typecheck, tests with full coverage, licence check, value scan and, when image inputs changed,
# a Docker build. Runs on pull requests (not drafts), manually and weekly. The weekly run catches dependency drift.
# Pushes to main are verified by the release workflow, so this one does not run there.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect image input changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image=false
          while IFS= read -r file; do
            case "$file" in
              Dockerfile|.dockerignore|LICENSE|THIRD-PARTY-NOTICES.md|pnpm-lock.yaml|pnpm-workspace.yaml) image=true ;;
              *compose*.yml|*compose*.yaml|package.json|*/package.json|tsconfig*.json|*/tsconfig*.json) image=true ;;
              .github/workflows/*) image=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Image inputs changed: ${image}"

  verify:
    name: Verify
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run verify
        run: pnpm run verify
      - name: Check third-party licences
        run: node scripts/licenses.mjs --check
      - name: Scan for committed values
        run: bash scripts/scan-values.sh

  # Build only, no push, amd64 only. Skipped when no image input changed.
  docker-build:
    name: Docker Build
    needs: changes
    if: >-
      needs.changes.outputs.image == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha

  gate:
    name: CI Gate
    needs: [changes, verify, docker-build]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
        run: |
          echo "changes=${CHANGES_RESULT} verify=${VERIFY_RESULT} docker-build=${DOCKER_BUILD_RESULT}"
          if [ "$CHANGES_RESULT" != "success" ] || [ "$VERIFY_RESULT" != "success" ]; then
            echo "A required job did not succeed." >&2
            exit 1
          fi
          if [ "$DOCKER_BUILD_RESULT" = "failure" ] || [ "$DOCKER_BUILD_RESULT" = "cancelled" ]; then
            echo "The Docker build did not succeed." >&2
            exit 1
          fi
