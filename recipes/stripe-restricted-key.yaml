# STATUS: wizard variant: full run verified live on 2026-11-04 (two sandboxes), earlier parts on 2026-11-03. Single-page variant: verified by probe on 2026-11-04 (fields, create, copy link in the list, key expiry), not as a full recipe run. The live mode, the full-access preset of the single-page variant (refused there) and the sign-in form are not verified
# Creates a Stripe restricted key for one account and mode (Stripe has no API that creates keys). The key is shown once in the
# "Your new secret key" view: the page prints it truncated, the full value sits in the attributes `aria-label` and `data-text`
# of that element (there is no input), so the token is captured from `data-text`.
#
# The wizard (checked in the sandbox on 2026-11-03):
#   1. "Choose how you'll use this key": cards "Building your own integration" (preselected), ...; button "Continue".
#   2. "Assign permissions to your key": cards "Start with a template", "Custom permissions", "Full access—except sensitive
#      operations", "Full access"; button "Continue".
#   3. (Custom only) "Select permissions": search field, a row per resource with the radios None / Read / Write.
#   4. "Name and review your key": field "Name", button "Create key".
#
# Pages render only in a foreground tab (the driver brings the tab to the front) and the dashboard can take 20 s or more to
# load, so every step waits for an element, never for a fixed time. A cookie banner ("Accept all" / "Reject all") overlaps the
# bottom right and intercepts clicks: it is rejected first (never accepted); that step is optional because the banner is
# shown only once per browser profile.
#
# Stripe shows one of two key forms at the same address, depending on the account. The recipe waits for either heading, records
# which one it got (`variant`) and runs the matching steps:
#   wizard:      the multi-step wizard described above.
#   single-page: the older single page "Create restricted API key": field "Key name" (#key-name), a resource filter, a row per
#                resource with None / Read / Write buttons, button "Create key". It returns to the key list; the new key is the
#                text of the row's `a[aria-label="Click to copy"]` link (the full key, shown in the list).
# The full-access preset is not explored on the single-page form: the run stops there before anything is created.
#
# Not verified: the live mode. The live dashboard may show a different key list ("Restricted keys" / "Standard keys" with
# "Create restricted key") and may ask to confirm the password; the pause step below waits for the human in that case. The
# live address is assumed to use the same wizard as the sandbox.
id: stripe-restricted-key
label: Stripe Restricted Key
host: dashboard.stripe.com
params:
  - key: account
    label: Stripe-Konto
    labelEn: Stripe account
    pattern: "^acct_[A-Za-z0-9]+$"
    help: "Account id of the Stripe account, for example acct_1AbC. It is part of the dashboard address."
  # A recipe has no stage, so the mode is a parameter. The connection facade passes the mode of the connection.
  - key: mode
    label: Modus
    labelEn: Mode
    options: ["sandbox", "live"]
    help: "sandbox: the sandbox of the account (test keys, rk_test_). live: live mode (rk_live_)."
  - key: preset
    label: Rechte
    labelEn: Permissions
    options: ["webhooks", "full-except-sensitive", "refunds"]
    default: webhooks
    help: "webhooks: only Webhook Endpoints, Event Destinations with Write. full-except-sensitive: Stripe's full access without sensitive operations. refunds: Charges and Refunds with Write, Payment Intents and Invoices with Read (for partial refunds)."
login:
  # Signed in = a dashboard page of an account. Signed out, the dashboard redirects to /login.
  expect: { url: "^https://dashboard\\.stripe\\.com/acct_[A-Za-z0-9]+/" }
  message: Bei Stripe anmelden (Passwort, 2FA).
  # Single sign-on: the button on Stripe's sign-in page (seen on the live page, cookie-less context, 2026-11-03). The
  # Google part is built in and not verified.
  methods:
    - id: google
      steps:
        - waitFor: { visible: { role: button, name: "Google" }, timeoutSeconds: 20 }
        - click: { role: button, name: "Google" }
  # Guided sign-in (the portal types the email and password the human entered for this run).
  # STATUS: not verified at all: no step of this form was checked against the real sign-in page. The selectors are generic.
  form:
    start: "https://dashboard.stripe.com/login"
    home: "https://dashboard.stripe.com/"
    steps:
      - waitFor: { visible: { css: 'input[type="email"]' }, timeoutSeconds: 30 }
      - fill: { css: 'input[type="email"]', value: "{{login.username}}" }
      - waitFor: { visible: { css: 'input[type="password"]' }, timeoutSeconds: 20 }
      - fill: { css: 'input[type="password"]', value: "{{login.password}}" }
      - click: { css: 'button[type="submit"]' }
    # not verified: selectors of the one-time code step.
    mfa:
      detect: { visible: { css: 'input[autocomplete="one-time-code"]' } }
      field: { css: 'input[autocomplete="one-time-code"]' }
      submit: { css: 'button[type="submit"]' }
    # not verified: a challenge the script cannot solve; the portal says so and the human tries again later.
    captcha:
      detect: { visible: { css: 'iframe[src*="hcaptcha.com/captcha"], iframe[title*="reCAPTCHA challenge"], iframe[src*="challenges.cloudflare.com"]' } }
      message: Stripe zeigt eine Sicherheitspruefung (CAPTCHA). Bitte spaeter erneut versuchen.
      messageEn: Stripe shows a security check (CAPTCHA). Try again later.
    # not verified: error texts.
    failure:
      - detect: { text: "Your email or password is incorrect" }
        message: Stripe hat E-Mail oder Passwort abgelehnt.
        messageEn: Stripe rejected the email or password.
steps:
  # Sandbox and live use different addresses; `when` picks the right one.
  - goto: "https://dashboard.stripe.com/{{account}}/test/apikeys/create"
    when: { var: mode, equals: sandbox }
  - goto: "https://dashboard.stripe.com/{{account}}/apikeys/create"
    when: { var: mode, equals: live }
  # Either heading (only the start of the wizard heading: the apostrophe of "you'll" may be a typographic one).
  - waitFor:
      any:
        - { text: "Choose how you" }
        - { text: "Create restricted API key" }
      timeoutSeconds: 90
  # Which form is it? The wizard is tested first, the single page only while the variant is still unset.
  - set: { var: variant, value: wizard }
    when: { visible: { text: "Choose how you" } }
  - set: { var: variant, value: single-page }
    when:
      all:
        - { var: variant, equals: "" }
        - { visible: { text: "Create restricted API key" } }
  # The full-access preset is not explored on the single-page form: refuse before anything exists.
  - fail: "This account shows the single-page key form; the preset full-except-sensitive is not supported there yet. Use the preset webhooks."
    when:
      all:
        - { var: variant, equals: single-page }
        - { var: preset, equals: full-except-sensitive }
  # The refunds preset is explored on the single-page form only (2026-11-04): refuse on the wizard before anything exists.
  - fail: "This account shows the key wizard; the preset refunds is supported on the single-page form only. Use the preset webhooks or full-except-sensitive."
    when:
      all:
        - { var: variant, equals: wizard }
        - { var: preset, equals: refunds }
  - click: { role: button, name: "Reject all", exact: true, optional: true, timeoutSeconds: 8 }

  # ---- Wizard ----
  # Step 1: "Building your own integration" is preselected.
  - click: { role: button, name: "Continue", exact: true }
    when: { var: variant, equals: wizard }
  - waitFor: { text: "Assign permissions to your key", timeoutSeconds: 60 }
    when: { var: variant, equals: wizard }
  - click: { role: button, name: "Reject all", exact: true, optional: true, timeoutSeconds: 2 }
    when: { var: variant, equals: wizard }
  # Step 2: the permission template. Each card is a label over a visually hidden radio input that intercepts pointer
  # events, so a click on the card text times out; the radio is checked directly (checked live on 2026-11-03).
  - check: { role: radio, name: "Custom permissions" }
    when:
      all:
        - { var: variant, equals: wizard }
        - { var: preset, equals: webhooks }
  - check: { role: radio, name: "Full access—except sensitive operations" }
    when:
      all:
        - { var: variant, equals: wizard }
        - { var: preset, equals: full-except-sensitive }
  - click: { role: button, name: "Continue", exact: true }
    when: { var: variant, equals: wizard }
  # Step 3 (custom permissions only): narrow the list with the search field, then set the one resource to Write.
  - waitFor: { text: "Select permissions", timeoutSeconds: 60 }
    when:
      all:
        - { var: variant, equals: wizard }
        - { var: preset, equals: webhooks }
  - fill: { css: 'input[type="search"]', value: "Webhook Endpoints" }
    when:
      all:
        - { var: variant, equals: wizard }
        - { var: preset, equals: webhooks }
  - waitFor: { text: "Webhook Endpoints, Event Destinations", timeoutSeconds: 30 }
    when:
      all:
        - { var: variant, equals: wizard }
        - { var: preset, equals: webhooks }
  # The filter leaves the section ("Section permission level") and its one resource row ("Permission level"), each with
  # None / Read / Write radios. Only the row's radio is set (checked live on 2026-11-03); a second match makes the run stop
  # before a key exists.
  - check: { css: 'role=group[name="Permission level"s] >> role=radio[name="Write"s]' }
    when:
      all:
        - { var: variant, equals: wizard }
        - { var: preset, equals: webhooks }
  - click: { role: button, name: "Continue", exact: true }
    when:
      all:
        - { var: variant, equals: wizard }
        - { var: preset, equals: webhooks }
  # Step 4: name and review.
  - waitFor: { text: "Name and review your key", timeoutSeconds: 60 }
    when: { var: variant, equals: wizard }
  # The page search box above is also a text input: the label must match exactly.
  - fill: { label: "Name", exact: true, value: "{{name}}" }
    when: { var: variant, equals: wizard }

  # ---- Single page (probed 2026-11-04) ----
  - waitFor: { visible: { css: "#key-name" }, timeoutSeconds: 30 }
    when: { var: variant, equals: single-page }
  - fill: { css: "#key-name", value: "{{name}}" }
    when: { var: variant, equals: single-page }
  - fill: { placeholder: "Filter resources", value: "Webhook Endpoints" }
    when:
      all:
        - { var: variant, equals: single-page }
        - { var: preset, equals: webhooks }
  # After the filter the row holds three buttons None / Read / Write (a segmented control without aria-pressed).
  - waitFor: { visible: { css: 'tr:has-text("Webhook Endpoints, Event Destinations")' }, timeoutSeconds: 30 }
    when:
      all:
        - { var: variant, equals: single-page }
        - { var: preset, equals: webhooks }
  - click: { css: 'tr:has-text("Webhook Endpoints, Event Destinations") >> role=button[name="Write"s]' }
    when:
      all:
        - { var: variant, equals: single-page }
        - { var: preset, equals: webhooks }
  # Preset refunds (rows probed 2026-11-04): each row has the column Permissions first, then Connect permissions, so the
  # first button with the level belongs to the account itself; the section header rows ("... View documentation") are excluded.
  - fill: { placeholder: "Filter resources", value: "Charges" }
    when:
      all:
        - { var: variant, equals: single-page }
        - { var: preset, equals: refunds }
  - waitFor: { visible: { css: 'tr:has-text("Charges and Refunds"):not(:has-text("View documentation"))' }, timeoutSeconds: 30 }
    when:
      all:
        - { var: variant, equals: single-page }
        - { var: preset, equals: refunds }
  - click: { css: 'tr:has-text("Charges and Refunds"):not(:has-text("View documentation")) >> role=button[name="Write"s] >> nth=0' }
    when:
      all:
        - { var: variant, equals: single-page }
        - { var: preset, equals: refunds }
  - fill: { placeholder: "Filter resources", value: "Payment Intents" }
    when:
      all:
        - { var: variant, equals: single-page }
        - { var: preset, equals: refunds }
  - waitFor: { visible: { css: 'tr:has-text("Payment Intents"):not(:has-text("View documentation"))' }, timeoutSeconds: 30 }
    when:
      all:
        - { var: variant, equals: single-page }
        - { var: preset, equals: refunds }
  - click: { css: 'tr:has-text("Payment Intents"):not(:has-text("View documentation")) >> role=button[name="Read"s] >> nth=0' }
    when:
      all:
        - { var: variant, equals: single-page }
        - { var: preset, equals: refunds }
  - fill: { placeholder: "Filter resources", value: "Invoices" }
    when:
      all:
        - { var: variant, equals: single-page }
        - { var: preset, equals: refunds }
  - waitFor: { visible: { css: 'tr:has-text("Invoices"):not(:has-text("View documentation"))' }, timeoutSeconds: 30 }
    when:
      all:
        - { var: variant, equals: single-page }
        - { var: preset, equals: refunds }
  - click: { css: 'tr:has-text("Invoices"):not(:has-text("View documentation")) >> role=button[name="Read"s] >> nth=0' }
    when:
      all:
        - { var: variant, equals: single-page }
        - { var: preset, equals: refunds }

  # ---- Both ----
  # The live mode may ask to confirm the password before the key is created.
  - pause:
      human: Stripe verlangt eine Passwortbestaetigung. Im Browserfenster das Passwort bestaetigen, dann geht es hier weiter.
      until: { hidden: { css: 'input[type="password"]' } }
    when: { var: mode, equals: live }
  - screenshot: rechte-vorher
  - click: { role: button, name: "Create key", createsToken: true }
    when: { var: variant, equals: wizard }
  - waitFor: { text: "Your new secret key", timeoutSeconds: 60 }
    when: { var: variant, equals: wizard }
  - click: { role: button, name: "Create key", exact: true, createsToken: true }
    when: { var: variant, equals: single-page }
  # The page returns to the key list (no dialog); the new key is the row with the name.
  - waitFor: { visible: { css: 'tr:has-text("{{name}}") a[aria-label="Click to copy"]' }, timeoutSeconds: 60 }
    when: { var: variant, equals: single-page }
capture:
  token:
    # Wizard (checked live on 2026-11-04): the result view and every key row of the list behind it carry a full key in the
    # attributes `aria-label` (visible element) and `data-text` (hidden). Only the element under the heading "Your new secret key"
    # holds the new key, so the capture starts at that heading and takes the nearest key element inside its container.
    find: { css: 'text="Your new secret key" >> xpath=ancestor::*[.//*[starts-with(@aria-label,"rk_")]][1] >> [aria-label^="rk_"]' }
    attribute: aria-label
    pattern: "^(rk_(test|live)_[A-Za-z0-9]+)$"
    # Single page (probe 2026-11-04): the row of the new key in the list; the text of its copy link is the full key. The first
    # candidate that is visible wins; the wizard's heading is never on the list page.
    alternatives:
      - { find: { css: 'tr:has-text("{{name}}") a[aria-label="Click to copy"]' } }
  externalId: { from: name }
mask:
  - { css: '[data-text^="rk_"]' }
  - { css: '[aria-label^="rk_"]' }
  - { css: 'a[aria-label="Click to copy"]' }
revoke:
  # Checked in the sandbox on 2026-11-03 (wizard UI) and by probe on 2026-11-04 (single-page UI): row menu -> "Expire key" ->
  # dialog "Expire API key" -> "Expire" -> row gone. The two UIs differ only in the menu button of the row.
  steps:
    - goto: "https://dashboard.stripe.com/{{account}}/test/apikeys"
      when: { var: mode, equals: sandbox }
    - goto: "https://dashboard.stripe.com/{{account}}/apikeys"
      when: { var: mode, equals: live }
    - waitFor: { visible: { css: 'tr:has-text("{{externalId}}")' }, timeoutSeconds: 90 }
    - click: { role: button, name: "Reject all", exact: true, optional: true, timeoutSeconds: 8 }
    - waitFor:
        any:
          - { visible: { css: 'tr:has-text("{{externalId}}") a[role=button][aria-haspopup=true]' } }
          - { visible: { css: 'tr:has-text("{{externalId}}") button[aria-haspopup="menu"]' } }
        timeoutSeconds: 30
    # The last menu button of the row belongs to the key.
    - set: { var: menu, value: anchor }
      when: { visible: { css: 'tr:has-text("{{externalId}}") a[role=button][aria-haspopup=true]' } }
    - set: { var: menu, value: button }
      when:
        all:
          - { var: menu, equals: "" }
          - { visible: { css: 'tr:has-text("{{externalId}}") button[aria-haspopup="menu"]' } }
    - click: { css: 'tr:has-text("{{externalId}}") a[role=button][aria-haspopup=true] >> nth=-1' }
      when: { var: menu, equals: anchor }
    - click: { css: 'tr:has-text("{{externalId}}") button[aria-haspopup="menu"] >> nth=-1' }
      when: { var: menu, equals: button }
    - click: { role: menuitem, name: "Expire key" }
    - waitFor: { text: "Expire API key", timeoutSeconds: 15 }
    - click: { role: button, name: "Expire", exact: true }
    - waitFor: { hidden: { css: 'tr:has-text("{{externalId}}")' }, timeoutSeconds: 30 }
