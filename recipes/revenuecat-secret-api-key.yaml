# STATUS: Formular und Liste am 2026-11-02 gegen die echte Seite geprueft; Anmeldung: nur der E-Mail-Schritt geprueft, Passwort-, 2FA-, Freigabe-, CAPTCHA- und Fehlerschritte nicht geprueft; der volle Rezeptlauf ist noch nicht geprueft
# Creates a RevenueCat secret API key (V2) with one access level per permission section. The key is shown in the key list
# (hidden behind "Show key"), in the row that carries the key's name. Selectors that name the row use Playwright CSS
# (`:has-text()`), because selectors cannot be scoped yet.
id: revenuecat-secret-api-key
label: RevenueCat Secret API Key
host: app.revenuecat.com
params:
  - key: projectId
    label: RevenueCat-Projekt-ID
    labelEn: RevenueCat project ID
    pattern: "^[a-z0-9]{6,20}$"
    help: "Part of the dashboard address after /projects/, for example proj1a2b3c4d."
  - key: projectConfiguration
    label: Projektkonfiguration
    labelEn: Project configuration
    options: ["No access", "Read only", "Read & write"]
    default: No access
  - key: customerInformation
    label: Kundeninformationen
    labelEn: Customer information
    options: ["No access", "Read only", "Read & write"]
    default: No access
  - key: chartsMetrics
    label: Charts und Kennzahlen
    labelEn: Charts and metrics
    options: ["No access", "Read only", "Read & write"]
    default: No access
  - key: audiences
    label: Zielgruppen
    labelEn: Audiences
    options: ["No access", "Read only", "Read & write"]
    default: No access
  - key: iam
    label: IAM
    labelEn: IAM
    options: ["No access", "Read only", "Read & write"]
    default: No access
login:
  # Signed in = any project page (the key page included). The key page alone would never hold right after the sign-in.
  expect: { url: "^https://app\\.revenuecat\\.com/projects/[^/]+/" }
  message: Bei RevenueCat anmelden (Passwort, 2FA).
  # Guided sign-in (the portal types the email and password the human entered for this run).
  # STATUS: the email step (input[name="email"], button "Log in") was checked on 2026-11-02 in a clean browser context.
  # STATUS: not verified: the password step, the one-time code, the approval wait, the CAPTCHA and the error texts below.
  form:
    start: "https://app.revenuecat.com/login"
    home: "https://app.revenuecat.com/"
    steps:
      - waitFor: { visible: { css: 'input[name="email"]' }, timeoutSeconds: 20 }
      - fill: { css: 'input[name="email"]', value: "{{login.username}}" }
      - click: { role: button, name: "Log in" }
      # not verified: the password field appears only after the email step.
      - waitFor: { visible: { css: 'input[type="password"]' }, timeoutSeconds: 20 }
      - fill: { css: 'input[type="password"]', value: "{{login.password}}" }
      - click: { css: 'button[type="submit"]' }
    # not verified: selectors of the one-time code step.
    mfa:
      detect: { visible: { css: 'input[autocomplete="one-time-code"], input[name="code"], input[name="otp"]' } }
      field: { css: 'input[autocomplete="one-time-code"], input[name="code"], input[name="otp"]' }
      submit: { css: 'button[type="submit"]' }
    # not verified: wording of the e-mail/device approval page.
    approval:
      detect: { text: "Check your email" }
      message: RevenueCat wartet auf eine Bestaetigung (E-Mail oder Geraet). Bitte dort bestaetigen, dann geht es hier weiter.
      messageEn: RevenueCat is waiting for an approval (email or device). Approve it there and the sign-in continues here.
    # not verified: a challenge the human has to solve in the browser window.
    captcha:
      detect: { visible: { css: 'iframe[src*="challenges.cloudflare.com"], iframe[title*="reCAPTCHA challenge"], iframe[src*="hcaptcha.com/captcha"]' } }
      message: RevenueCat zeigt eine Sicherheitspruefung (CAPTCHA). Bitte im Browserfenster loesen.
      messageEn: RevenueCat shows a security check (CAPTCHA). Solve it in the browser window.
    # not verified: error texts.
    failure:
      - detect: { text: "Invalid email or password" }
        message: RevenueCat hat E-Mail oder Passwort abgelehnt.
        messageEn: RevenueCat rejected the email or password.
      - detect: { text: "Incorrect password" }
        message: RevenueCat hat das Passwort abgelehnt.
        messageEn: RevenueCat rejected the password.
      - detect: { text: "Too many attempts" }
        message: RevenueCat hat das Konto vorerst gesperrt (zu viele Versuche). Spaeter erneut versuchen.
        messageEn: RevenueCat has locked the account for now (too many attempts). Try again later.
steps:
  - goto: "https://app.revenuecat.com/projects/{{projectId}}/api-keys/new"
  - waitFor: { visible: { css: 'input[name="label"]' } }
  - fill: { css: 'input[name="label"]', value: "{{name}}" }
  # The API version is the first combobox in the page's main area.
  - click: { css: "main [role=combobox] >> nth=0" }
  - click: { role: option, name: "V2" }
  - click: { role: combobox, name: "Project configuration permissions" }
  - click: { role: option, name: "{{projectConfiguration}}" }
  - click: { role: combobox, name: "Customer information permissions" }
  - click: { role: option, name: "{{customerInformation}}" }
  - click: { role: combobox, name: "Charts metrics permissions" }
  - click: { role: option, name: "{{chartsMetrics}}" }
  - click: { role: combobox, name: "Audiences permissions" }
  - click: { role: option, name: "{{audiences}}" }
  - click: { role: combobox, name: "Iam permissions" }
  - click: { role: option, name: "{{iam}}" }
  - screenshot: formular-vorher
  - click: { role: button, name: "Generate", createsToken: true }
  # Back on the key list (not the "new" form).
  - waitFor: { url: "^https://app\\.revenuecat\\.com/projects/[^/]+/api-keys/?$" }
  - click: { css: '[role=row]:has-text("{{name}}") button[aria-label="Show key"]' }
capture:
  token:
    find: { css: '[role=row]:has-text("{{name}}") [data-testid=api-key-display]' }
    pattern: "^(sk_[A-Za-z0-9]+)$"
  externalId: { from: name }
mask:
  - { css: "[data-testid=api-key-display]" }
revoke:
  steps:
    - goto: "https://app.revenuecat.com/projects/{{projectId}}/api-keys"
    - waitFor: { visible: { css: '[role=row]:has-text("{{externalId}}")' } }
    - click: { css: '[role=row]:has-text("{{externalId}}") button[aria-label="More"]' }
    - click: { role: menuitem, name: "Revoke" }
    - click: { css: '[role=dialog] button:has-text("Confirm")' }
    - waitFor: { hidden: { css: '[role=row]:has-text("{{externalId}}")' } }
