# STATUS: sign-in verified live 2026-11-04 (German Console, individual organization; email plus one-time code). The key dialog fields (name, expiry, workspace, submit button) were checked by a read-only probe that created no key. The view after creation and the capture of the key were verified live on 2026-11-09 with one-day keys. The choice of another workspace, and revoke are NOT verified.
# Creates an Anthropic API key on platform.claude.com (Settings, API keys, "Create key") in a workspace. The key is shown once,
# in a dialog. The Admin API cannot create API keys, so this recipe is the only way to make one; it works for an individual
# organization too (no admin key needed). Revoke goes through the Admin API when the `anthropic` connection holds an Admin key
# (the provider does that); the revoke section below is the fallback in the browser (not verified). The Personal way of the
# Anthropic facade runs this recipe with `days` = 90.
# The Console renders in the language of the account (German for the probed account), so every text selector accepts both
# German and English as a /pattern/flags text; placeholders, types and structure are used where they exist.
# The expiry of a key is always filled: the dialog offers 30 days by default (kept for `days` = 30); another number of days is
# picked by its option text (the Console offers 1, 7 and 30) and fails visibly, before a key exists, for any other number. The date is `days` from today.
id: anthropic-api-key
label: Anthropic API Key
host: platform.claude.com
# The old Console address redirects to the new one.
allowHosts: [console.anthropic.com]
params:
  - key: workspace
    label: Workspace
    labelEn: Workspace
    required: false
    default: ""
    help: "Name of the workspace the key belongs to. Empty (or Default) keeps the Default workspace of the dialog."
login:
  # The sign-in screen of the Console keeps the address /settings/keys (checked live on 2026-11-04: it shows the Google and the
  # email button), so the address alone says nothing: the sign-in buttons and the email field must be absent too.
  expect:
    all:
      - { url: "^https://(platform\\.claude\\.com|console\\.anthropic\\.com)/(settings|dashboard|workbench|home|usage|logs|cost|organization)" }
      - { hidden: { role: button, name: '/^(Continue|Mit|Weiter|Fortfahren).*e-?mail/i' } }
      - { hidden: { role: button, name: '/^(Continue|Mit|Weiter|Fortfahren).*Google/i' } }
      - { hidden: { css: 'input[type="email"], input[name="email"]' } }
  message: Bei Anthropic anmelden (platform.claude.com).
steps:
  - goto: "https://platform.claude.com/settings/keys"
  # The Console shows a cookie banner (German: "Alle Cookies ablehnen"): rejected, never accepted; optional because it shows
  # once per profile, and skipped when it cannot be clicked (verified live: the click once failed with "not actionable").
  - click: { role: button, name: '/^(Reject all cookies|Alle Cookies ablehnen)$/i', optional: true, timeoutSeconds: 3 }
  # The create button appears twice on the page (header and empty state): the first visible one.
  - waitFor: { visible: { role: button, name: '/^(Create key|Schlüssel erstellen)$/i', first: true } }
  - click: { role: button, name: '/^(Create key|Schlüssel erstellen)$/i', first: true }
  # Dialog 1 explains identity federation and offers the plain API key (German: "Mit einem API-Schlüssel fortfahren").
  - click: { role: button, name: '/^(Continue with an API key|Mit einem API-Schlüssel fortfahren)/i', optional: true, timeoutSeconds: 5 }
  # Dialog 2: the name field has the placeholder "my-secret-key" in every language.
  - waitFor: { visible: { placeholder: "my-secret-key" } }
  - fill: { placeholder: "my-secret-key", value: "{{name}}" }
  # Expiry: the first combobox of the dialog, it shows "30 Tage (9. Dez. 2026)" / "30 days (...)". 30 days is the default of the
  # dialog; it also offers 3 hours, 1 day, 7 days, a custom date and never (checked live on 2026-11-09). Another number of days
  # fails here, before a key exists.
  - click: { css: "[role=dialog] button[role=combobox]", first: true }
    when: { var: days, notEquals: "30" }
  - click: { role: option, name: '/^{{days}} ?(day|Tag)/i', first: true }
    when: { var: days, notEquals: "30" }
  # Workspace: a combobox that shows "Standard-Arbeitsbereich" / "Default workspace".
  - click: { css: "[role=dialog] button[role=combobox]:has-text('Standard'), [role=dialog] button[role=combobox]:has-text('Default')", first: true }
    when: { all: [{ var: workspace, notEquals: "" }, { var: workspace, notEquals: "Default" }] }
  - click: { role: option, name: "{{workspace}}", exact: true }
    when: { all: [{ var: workspace, notEquals: "" }, { var: workspace, notEquals: "Default" }] }
  - screenshot: formular-vorher
  - click: { css: "[role=dialog] button[type=submit]", createsToken: true }
  # The form stays open for a few seconds while the key is created, with its name field read-only. The key then appears as plain
  # text in a new view ("Deinen API-Schlüssel speichern"), in an element with this test id (checked live on 2026-11-09; the id
  # says "admin", it is the same view for a normal key). Leaving this page early cancels the creation.
  - waitFor: { visible: { testid: admin-api-key }, timeoutSeconds: 30 }
capture:
  token:
    find: { testid: admin-api-key }
    pattern: "^sk-ant-(?:api|usr)[0-9]*-[A-Za-z0-9_-]{40,}$"
  externalId: { from: name }
  expires: { from: days }
mask:
  - { testid: admin-api-key }
revoke:
  # not verified: the row is found by the key's name; the menu and the confirm button are guesses (both languages).
  steps:
    - goto: "https://platform.claude.com/settings/keys"
    - waitFor: { visible: { css: '[role=row]:has-text("{{externalId}}")' } }
    - click: { css: '[role=row]:has-text("{{externalId}}") button[aria-label="More"]' }
    - click: { role: menuitem, name: '/^(Delete|Archive|Löschen|Archivieren)/i' }
    - click: { role: button, name: '/^(Delete|Archive|Löschen|Archivieren)/i', first: true }
    - waitFor: { hidden: { css: '[role=row]:has-text("{{externalId}}")' } }
