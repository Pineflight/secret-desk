# STATUS: sign-in verified live 2026-11-04 (German Console, individual organization; email plus one-time code). On an individual organization the Admin keys page has no create button: the recipe detects that and ends as "unsupported" (verified by probe). Creating an admin key in a real organization (dialog, capture) and revoke are NOT verified; the Google sign-in is not verified.
# Creates an organization Admin API key on platform.claude.com (Settings, Admin keys). The portal stores it as the `anthropic`
# connection and uses it to list workspaces and to check and deactivate API keys. The Admin API cannot create API keys, so the
# keys themselves come from the recipe `anthropic-api-key`, which works without an admin key. This recipe is optional: it needs
# an Anthropic organization and its admin role. An individual organization has no admin keys; the recipe then ends as
# "unsupported" instead of failing, and the portal reports "API keys are created in the browser". Text selectors accept German
# and English as /pattern/flags texts (the Console follows the account language). The Console moved from console.anthropic.com
# to platform.claude.com; both hosts are accepted.
id: anthropic-admin-key
label: Anthropic Admin API Key
host: platform.claude.com
# The old Console address redirects to the new one.
allowHosts: [console.anthropic.com]
params: []
login:
  # Sign-in methods besides the form below (the email method). The identity-provider part is built in; the recipe declares only
  # the button on the Console sign-in page. not verified: the button name.
  methods:
    - id: google
      steps:
        - waitFor: { visible: { role: button, name: '/^(Continue|Mit|Weiter|Fortfahren).*Google/i' }, timeoutSeconds: 20 }
        - click: { role: button, name: '/^(Continue|Mit|Weiter|Fortfahren).*Google/i' }
  # Signed in = any Console page after the sign-in (not verified: the list of paths).
  # The sign-in screen of the Console keeps the address /settings/keys (checked live on 2026-11-04: it shows the Google and the
  # email button), so the address alone says nothing: the sign-in buttons and the email field must be absent too.
  expect:
    all:
      - { url: "^https://(platform\\.claude\\.com|console\\.anthropic\\.com)/(settings|dashboard|workbench|home|usage|logs|cost|organization)" }
      - { hidden: { role: button, name: '/^(Continue|Mit|Weiter|Fortfahren).*e-?mail/i' } }
      - { hidden: { role: button, name: '/^(Continue|Mit|Weiter|Fortfahren).*Google/i' } }
      - { hidden: { css: 'input[type="email"], input[name="email"]' } }
  message: Bei Anthropic anmelden (platform.claude.com).
  # Guided sign-in. The Console signs in by email: it sends a one-time code (and a link) instead of asking for a password,
  # so this form has no password step and the portal asks for the code.
  # STATUS: the email, one-time code and submit steps ran live on 2026-11-04; the approval, captcha and failure texts are not verified.
  form:
    passwordless: true
    start: "https://platform.claude.com/login"
    home: "https://platform.claude.com/settings/keys"
    steps:
      # not verified: the email field and the continue button.
      - waitFor: { visible: { css: 'input[type="email"], input[name="email"]' }, timeoutSeconds: 20 }
      - fill: { css: 'input[type="email"], input[name="email"]', value: "{{login.username}}" }
      - click: { role: button, name: '/^(Continue|Mit|Weiter|Fortfahren).*e-?mail/i' }
    # not verified: selectors of the one-time code step (the email carries a code; the field takes it).
    mfa:
      detect: { visible: { css: 'input[autocomplete="one-time-code"], input[name="code"], input[inputmode="numeric"]' } }
      field: { css: 'input[autocomplete="one-time-code"], input[name="code"], input[inputmode="numeric"]' }
      submit: { css: 'button[type="submit"]' }
    # not verified: wording of the page that says the email with the link was sent.
    approval:
      detect: { text: "Check your email" }
      message: Anthropic hat einen Anmeldelink per E-Mail geschickt. Bitte den Link oeffnen oder den Code eingeben, dann geht es hier weiter.
      messageEn: Anthropic sent a sign-in link by email. Open the link or enter the code, and the sign-in continues here.
    # not verified: a challenge the script cannot solve; the portal says so and the human tries again later.
    captcha:
      detect: { visible: { css: 'iframe[src*="challenges.cloudflare.com"], iframe[title*="reCAPTCHA challenge"], iframe[src*="hcaptcha.com/captcha"]' } }
      message: Anthropic zeigt eine Sicherheitspruefung (CAPTCHA). Bitte spaeter erneut versuchen.
      messageEn: Anthropic shows a security check (CAPTCHA). Try again later.
    # not verified: error texts.
    failure:
      - detect: { text: "Invalid code" }
        message: Anthropic hat den Code abgelehnt.
        messageEn: Anthropic rejected the code.
      - detect: { text: "Too many" }
        message: Anthropic hat die Anmeldung vorerst gesperrt (zu viele Versuche). Spaeter erneut versuchen.
        messageEn: Anthropic has blocked the sign-in for now (too many attempts). Try again later.
steps:
  - goto: "https://platform.claude.com/settings/admin-keys"
  # The Console shows a cookie banner (German: "Alle Cookies ablehnen"): rejected, never accepted; skipped when absent or when
  # it cannot be clicked.
  - click: { role: button, name: '/^(Reject all cookies|Alle Cookies ablehnen)$/i', optional: true, timeoutSeconds: 3 }
  # An individual organization has no admin keys and no create button (checked live on 2026-11-04). Not an error of the recipe:
  # the run ends as "unsupported" and the portal says that API keys are created in the browser.
  - fail: "Admin keys need an Anthropic organization; API keys are created in the browser."
    unsupported: true
    when: { absent: { role: button, name: '/^(Create Admin Key|Create key|Admin-Schlüssel erstellen|Schlüssel erstellen)$/i', first: true }, timeoutSeconds: 8 }
  # not verified: everything from here on needs an organization.
  - click: { role: button, name: '/^(Create Admin Key|Create key|Admin-Schlüssel erstellen|Schlüssel erstellen)$/i', first: true }
  - waitFor: { visible: { css: "[role=dialog] input[type=text]" } }
  - fill: { css: "[role=dialog] input[type=text] >> nth=0", value: "{{name}}" }
  - screenshot: formular-vorher
  - click: { css: "[role=dialog] button[type=submit]", createsToken: true }
  - waitFor: { visible: { css: "[role=dialog] input[readonly], [role=dialog] code" } }
capture:
  token:
    find: { css: "[role=dialog] input[readonly], [role=dialog] code" }
    pattern: "^sk-ant-admin[0-9]*-[A-Za-z0-9_-]+$"
  externalId: { from: name }
mask:
  - { css: "[role=dialog] input[readonly], [role=dialog] code" }
revoke:
  # not verified: the row is found by the key's name; the menu and the confirm button are guesses.
  steps:
    - goto: "https://platform.claude.com/settings/admin-keys"
    - waitFor: { visible: { css: '[role=row]:has-text("{{externalId}}")' } }
    - click: { css: '[role=row]:has-text("{{externalId}}") button[aria-label="More"]' }
    - click: { role: menuitem, name: '/^(Delete|Archive|Löschen|Archivieren)/i' }
    - click: { role: button, name: '/^(Delete|Archive|Löschen|Archivieren)/i', first: true }
    - waitFor: { hidden: { css: '[role=row]:has-text("{{externalId}}")' } }
