# STATUS: voller Rezeptlauf am 2026-11-03 gegen die echte Seite geprueft (fuenf Tokens mit Bereich angelegt, Voreinstellung per Eingabetaste auf der Option); Anmeldeformular und Single Sign-on nicht geprueft (nur der Anbieter-Knopf wurde am 2026-11-03 gesehen)
# Creates a scoped Supabase access token: one organization, one project, a permission preset and an expiry. Supabase shows
# the token only once, in a read-only field of the "Token created" dialog. A scoped token reaches only the chosen project,
# unlike the legacy token with full account access.
id: supabase-access-token
label: Supabase Access Token
host: supabase.com
params:
  - key: organization
    label: Organisation
    labelEn: Organization
    help: "Name of the Supabase organization as the token form lists it, for example AcmeApp."
  - key: project
    label: Projekt
    labelEn: Project
    help: "Project name as the token form lists it, for example acme-app-staging."
  - key: preset
    label: Rechte
    labelEn: Permissions
    options: ["Read-only", "Full access"]
    default: Full access
    help: "Applies to the chosen project only."
  - key: expiry
    label: Ablauf
    labelEn: Expiry
    options: ["24 hours", "30 days", "90 days", "Never"]
    default: 90 days
login:
  # Signed in = a dashboard page other than the sign-in page (not verified: the sign-in path /dashboard/sign-in).
  expect: { url: "^https://supabase\\.com/dashboard/(?!sign-in)" }
  message: Bei Supabase anmelden (Passwort, 2FA).
  # Single sign-on: the button on Supabase's sign-in page (seen live, cookie-less context, 2026-11-03). The GitHub part is built in
  # and not verified.
  methods:
    - id: github
      steps:
        - waitFor: { visible: { role: button, name: "Continue with GitHub" }, timeoutSeconds: 20 }
        - click: { role: button, name: "Continue with GitHub" }
  # Guided sign-in with email and password typed in the portal.
  # STATUS: not verified at all: no step of this form was checked against the real sign-in page. The selectors are generic.
  form:
    start: "https://supabase.com/dashboard/sign-in"
    home: "https://supabase.com/dashboard/account/tokens"
    steps:
      - waitFor: { visible: { css: 'input[type="email"]' }, timeoutSeconds: 20 }
      - fill: { css: 'input[type="email"]', value: "{{login.username}}" }
      - fill: { css: 'input[type="password"]', value: "{{login.password}}" }
      - click: { role: button, name: "Sign In" }
    # not verified: selectors of the one-time code step.
    mfa:
      detect: { visible: { css: 'input[autocomplete="one-time-code"]' } }
      field: { css: 'input[autocomplete="one-time-code"]' }
      submit: { css: 'button[type="submit"]' }
    # not verified: error text.
    failure:
      - detect: { text: "Invalid login credentials" }
        message: Supabase hat E-Mail oder Passwort abgelehnt.
        messageEn: Supabase rejected the email or password.
steps:
  - goto: "https://supabase.com/dashboard/account/tokens"
  - waitFor: { visible: { role: button, name: "Generate new token" } }
  - click: { role: button, name: "Generate new token" }
  - waitFor: { visible: { css: 'input[name="tokenName"]' } }
  - fill: { css: 'input[name="tokenName"]', value: "{{name}}" }
  # The expiry is the first combobox of the dialog.
  - click: { css: "[role=dialog] button[role=combobox] >> nth=0" }
  - click: { role: option, name: "{{expiry}}" }
  # Resource access stays on "Project" (the default): one organization, then its projects.
  - click: { css: "button#organizationSlugs" }
  - click: { role: option, name: "{{organization}}", exact: true }
  - click: { css: "button#projectRefs" }
  - click: { role: option, name: "{{project}}", exact: true }
  - press: { key: "Escape" }
  # The preset list offers "No access", "Read-only", "Full access". A click on "Full access" is blocked by its description
  # tooltip, and End/Enter on the list is timing-dependent; pressing Enter on the option itself is reliable (checked live
  # 2026-11-03).
  - click: { role: combobox, name: "Permission preset" }
  - waitFor: { visible: { role: option, name: "{{preset}}" } }
  - press: { key: "Enter", role: option, name: "{{preset}}" }
  - click: { role: button, name: "Review access" }
  - waitFor: { text: "Token summary" }
  - screenshot: formular-vorher
  - click: { role: button, name: "Create token", createsToken: true }
  - waitFor: { visible: { css: "#scoped-access-token-value" } }
capture:
  token:
    find: { css: "#scoped-access-token-value" }
    pattern: "^(sbp_[A-Za-z0-9_]+)$"
  externalId: { from: name }
mask:
  - { css: "#scoped-access-token-value" }
revoke:
  steps:
    - goto: "https://supabase.com/dashboard/account/tokens"
    - waitFor: { visible: { css: 'tr:has(p[title="{{externalId}}"])' } }
    - click: { css: 'tr:has(p[title="{{externalId}}"]) >> role=button[name="More options"]' }
    - click: { role: menuitem, name: "Delete token" }
    - click: { css: '[role=dialog] button:has-text("Delete")' }
    - waitFor: { hidden: { css: 'tr:has(p[title="{{externalId}}"])' } }
