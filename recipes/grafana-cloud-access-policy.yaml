# STATUS: the first sign-in page (email first, password on the next page, SSO buttons #sso-buttons-*) was seen live on 2026-11-05; nothing else of this recipe is verified against the live site: the password page, the single sign-on buttons, the Access
# Policies page, the policy and token dialogs, the capture and revoke are all written from memory of grafana.com and every
# selector is a guess. Each step waits for its element, so a wrong guess fails visibly instead of clicking something else. Text
# selectors accept /pattern/flags so the page may follow the account language. Do a supervised trial with a throwaway account.
# Creates a Grafana Cloud access policy for the portal (scopes below) and a token for it on grafana.com. The portal stores the
# token (`glc_...`) as the `grafana-cloud` connection. With it the portal creates stack service accounts and Cloud access
# policy tokens through the Cloud API, without the browser. The policy name and the token name are the run's name.
id: grafana-cloud-access-policy
label: Grafana Cloud access policy token
host: grafana.com
params:
  - key: expiry
    label: Ablauf des Tokens
    labelEn: Token expiry
    options: ["30 days", "90 days", "No expiry"]
    default: 90 days
    help: "The token option as grafana.com lists it. The portal stores the same horizon with the connection."
login:
  # Signed in = the organization or profile pages, not the sign-in page (not verified: the paths).
  expect: { url: "^https://grafana\\.com/(orgs/|profile|account)" }
  message: Bei Grafana anmelden (grafana.com).
  # Sign-in methods besides the form below (the email method). The identity-provider part is built in; the recipe declares only
  # the button on grafana.com's sign-in page. not verified: the button names (a substring is enough for the text selector).
  methods:
    - id: google
      steps:
        - waitFor: { visible: { role: button, name: '/google/i' }, timeoutSeconds: 20 }
        - click: { role: button, name: '/google/i' }
    - id: github
      steps:
        - waitFor: { visible: { role: button, name: '/github/i' }, timeoutSeconds: 20 }
        - click: { role: button, name: '/github/i' }
    - id: microsoft
      steps:
        - waitFor: { visible: { role: button, name: '/microsoft/i' }, timeoutSeconds: 20 }
        - click: { role: button, name: '/microsoft/i' }
  # Guided sign-in (the portal types the email and password the human entered for this run).
  # Seen live 2026-11-05: the page asks for "Email or username" first (input name=login, button #submit "Sign In") and shows the
  # password field only after that; a cookie banner may cover the page. The password page and everything after it are not verified.
  form:
    start: "https://grafana.com/auth/sign-in"
    home: "https://grafana.com/profile/org"
    steps:
      - click: { css: "#onetrust-reject-all-handler", optional: true, timeoutSeconds: 5 }
      - waitFor: { visible: { css: 'input[name="login"]' }, timeoutSeconds: 30 }
      - fill: { css: 'input[name="login"]', value: "{{login.username}}" }
      - click: { css: "#submit" }
      - waitFor: { visible: { css: 'input[type="password"]' }, timeoutSeconds: 30 }
      - fill: { css: 'input[type="password"]', value: "{{login.password}}" }
      - click: { css: 'button[type="submit"]' }
    # not verified: selectors of the one-time code step.
    mfa:
      detect: { visible: { css: 'input[autocomplete="one-time-code"], input[name="code"], input[name="otp"]' } }
      field: { css: 'input[autocomplete="one-time-code"], input[name="code"], input[name="otp"]' }
      submit: { css: 'button[type="submit"]' }
    # not verified: a challenge the script cannot solve; the portal says so and the human tries again later.
    captcha:
      detect: { visible: { css: 'iframe[src*="challenges.cloudflare.com"], iframe[title*="reCAPTCHA challenge"], iframe[src*="hcaptcha.com/captcha"]' } }
      message: Grafana zeigt eine Sicherheitspruefung (CAPTCHA). Bitte spaeter erneut versuchen.
      messageEn: Grafana shows a security check (CAPTCHA). Try again later.
    # not verified: error texts.
    failure:
      - detect: { text: "Invalid login or password" }
        message: Grafana hat Anmeldename oder Passwort abgelehnt.
        messageEn: Grafana rejected the login or password.
      - detect: { text: "Too many" }
        message: Grafana hat das Konto vorerst gesperrt (zu viele Versuche). Spaeter erneut versuchen.
        messageEn: Grafana has locked the account for now (too many attempts). Try again later.
steps:
  # /profile/org leads a signed-in user to their organization (the guide of the grafana connection says so); the organization
  # slug is not needed, the link in the organization's navigation is followed instead. not verified: the link name.
  - goto: "https://grafana.com/profile/org"
  - waitFor: { visible: { role: link, name: '/access policies/i', first: true } }
  - click: { role: link, name: '/access policies/i', first: true }
  - waitFor: { url: "/access-policies" }
  - waitFor: { visible: { role: button, name: '/create access policy/i', first: true } }
  - click: { role: button, name: '/create access policy/i', first: true }
  # not verified: the dialog takes a display name; the technical name follows from it.
  - waitFor: { visible: { label: '/display name/i' } }
  - fill: { label: '/display name/i', value: "{{name}}" }
  # Scopes: only what the portal needs. not verified: that the scopes are checkboxes named like the scope. The two scopes in the
  # second block are the ones this recipe is least sure of (the delete scope for revoking tokens, and the stack service accounts
  # scope for creating stack service accounts through the Cloud API): they are ticked when the dialog offers them.
  - click: { role: checkbox, name: "accesspolicies:read" }
  - click: { role: checkbox, name: "accesspolicies:write" }
  - click: { role: checkbox, name: "stacks:read" }
  - click: { role: checkbox, name: "accesspolicies:delete", optional: true, timeoutSeconds: 3 }
  - click: { role: checkbox, name: "stack-service-accounts:write", optional: true, timeoutSeconds: 3 }
  - screenshot: richtlinie-vorher
  - click: { role: button, name: '/^create$/i', first: true }
  # The new policy's page: add a token. not verified: the button, the field labels and the expiry control.
  - waitFor: { visible: { role: button, name: '/add token/i', first: true } }
  - click: { role: button, name: '/add token/i', first: true }
  - waitFor: { visible: { label: '/token name/i' } }
  - fill: { label: '/token name/i', value: "{{name}}" }
  - click: { role: combobox, name: '/expir/i' }
  - click: { role: option, name: "{{expiry}}" }
  - screenshot: token-vorher
  - click: { css: "[role=dialog] button:has-text('Create'), [role=dialog] button:has-text('Add')", createsToken: true }
  # The provider may ask to verify the identity (password or code) before it shows the key: answered in the portal.
  # Passes at once when the key is shown. NOT VERIFIED: no verification was seen at this provider yet.
  - confirmAccess:
      flow: generic-verify
      until: { visible: { css: "[role=dialog] input[readonly]" } }
      timeoutSeconds: 30
  - waitFor: { visible: { css: "[role=dialog] input[readonly]" } }
capture:
  token:
    find: { css: "[role=dialog] input[readonly]" }
    pattern: "^(glc_[A-Za-z0-9_=+/-]+)$"
  externalId: { from: name }
mask:
  - { css: "[role=dialog] input[readonly]" }
revoke:
  # not verified: the policy is found by its name (the run's name); the menu and the confirm button are guesses. Deleting the
  # policy removes its tokens with it.
  steps:
    - goto: "https://grafana.com/profile/org"
    - waitFor: { visible: { role: link, name: '/access policies/i', first: true } }
    - click: { role: link, name: '/access policies/i', first: true }
    - waitFor: { visible: { css: '[role=row]:has-text("{{externalId}}")' } }
    - click: { css: '[role=row]:has-text("{{externalId}}") button[aria-label="More"], [role=row]:has-text("{{externalId}}") button[aria-haspopup]' }
    - click: { role: menuitem, name: '/delete/i' }
    - click: { css: '[role=dialog] button:has-text("Delete")' }
    - waitFor: { hidden: { css: '[role=row]:has-text("{{externalId}}")' } }
