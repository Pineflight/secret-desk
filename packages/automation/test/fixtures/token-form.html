<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Token anlegen</title></head>
<body>
  <h1>Neuer Token</h1>
  <label for="n">Name</label>
  <input id="n" name="name">
  <label for="e">Ablauf</label>
  <select id="e"><option value="30">30 days</option><option value="90">90 days</option></select>
  <label><input type="checkbox" id="c"> Nur lesen</label>
  <button id="b" type="button">Create token</button>
  <div id="out" hidden>
    <input id="tok" readonly>
  </div>
  <script>
    document.getElementById("b").addEventListener("click", () => {
      const name = document.getElementById("n").value;
      document.getElementById("tok").value = "tok_" + name.replace(/[^a-z0-9]/g, "") + "ok42";
      document.getElementById("out").hidden = false;
    });
  </script>
</body></html>
